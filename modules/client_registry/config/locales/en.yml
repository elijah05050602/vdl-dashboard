      party:
        kind: "Type"
        name: "Name"
        tin: "TIN"
        email: "Email"
        phone: "Phone"
        address: "Address"
        notes: "Notes"
        aliases: "Alternate names"
        matter_parties: "Matters"
      party_alias:
        name: "Alternate name"
        alias_type: "Kind of name"
      matter_party:
        party: "Party"
        party_id: "Party"
        role: "Role on the matter"
        notes: "Notes"
