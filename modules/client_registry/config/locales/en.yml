en:
  plugin_openproject_client_registry:
    name: "VDL client and party registry"
    description: "Firm-wide registry of clients and parties with aliases, linked to matters by role."

  label_client_registry: "Clients and parties"
  label_matter_parties: "Parties"

  permission_view_client_registry: "View the client and party registry"
  permission_manage_client_registry: "Add and edit clients and parties in the registry"
  permission_view_matter_parties: "View the parties of a matter"
  permission_manage_matter_parties: "Link and unlink parties on a matter"

  activerecord:
