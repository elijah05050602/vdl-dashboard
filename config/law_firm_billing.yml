# Law firm billing defaults for a Philippine law office.
#
# Read by the law firm billing seeder (bin/rails db:seed) and when people are
# added to a matter. Edit the numbers here, then run `bin/rails db:seed` again:
# existing records are left alone, only missing ones are added.
#
# All amounts are in Philippine pesos and exclude VAT.

# Value-added tax on professional fees. Amounts in OpenProject stay
# VAT-exclusive; add VAT when invoicing.
vat_rate: 0.12

# Expanded withholding tax (EWT) that corporate and government clients withhold
# from professional fees and remit to the BIR (they give the firm BIR Form 2307).
# For a law firm (juridical person) it is 15% when the firm's gross income for
# the year exceeds ₱720,000, otherwise 10%. Like VAT, it is applied when
# preparing the billing statement.
ewt_rate: 0.15

# Project modules switched on for new matters, so time, fees, budgets and
# cost reports are available without extra setup.
default_project_modules:
  - costs
  - budgets

# Project roles a person can hold on a matter. When someone is added to a
# matter with one of these roles and has no hourly rate there yet, the rate
# below becomes their hourly rate on that matter. If they hold several roles,
# the highest rate wins. Rates set by hand are never overwritten.
billing_roles:
  - name: Partner
    hourly_rate: 8000
    permissions: :partner
  - name: Senior associate
    hourly_rate: 5000
    permissions: :timekeeper
  - name: Associate
    hourly_rate: 3500
    permissions: :timekeeper
  - name: Paralegal
    hourly_rate: 1500
    permissions: :timekeeper
  - name: Legal assistant
    hourly_rate: 800
    permissions: :timekeeper

# Time logged with these activities is non-billable. Every other activity is
# billable. Missing activities are created.
non_billable_activities:
  - Administrative (non-billable)
  - Pro bono (non-billable)
  - Business development (non-billable)

# Fees and disbursements billed to the client, logged on a matter with
# "Log unit costs". A rate of 1 per peso means the amount is entered directly.
# The kind decides where an entry goes on an invoice: fees are professional
# fees (subject to EWT), disbursements are expenses billed back to the client.
# Cost types not listed here are treated as fees.
expense_types:
  # Professional fees
  - name: Acceptance fee
    kind: fee
    unit: peso
    unit_plural: pesos
    rate: 1
    default: true
  - name: Appearance fee
    kind: fee
    unit: hearing
    unit_plural: hearings
    rate: 5000
  - name: Monthly retainer
    kind: fee
    unit: month
    unit_plural: months
    rate: 30000
  - name: Fixed fee
    kind: fee
    unit: peso
    unit_plural: pesos
    rate: 1
  - name: Success fee
    kind: fee
    unit: peso
    unit_plural: pesos
    rate: 1
  # Disbursements
  - name: Docket and filing fees
    kind: disbursement
    unit: peso
    unit_plural: pesos
    rate: 1
  - name: Notarial fee
    kind: disbursement
    unit: document
    unit_plural: documents
    rate: 300
  - name: Photocopies
    kind: disbursement
    unit: page
    unit_plural: pages
    rate: 3
  - name: Courier
    kind: disbursement
    unit: delivery
    unit_plural: deliveries
    rate: 150
  - name: Transportation
    kind: disbursement
    unit: peso
    unit_plural: pesos
    rate: 1

# Receivables: an invoice is due this many days after it is issued, unless the
# matter's billing terms say otherwise. Used for the aging report.
receivables:
  payment_terms_days: 15

# Invoices issued from a matter's Invoices page. The firm details below are
# printed on every invoice and must match the firm's BIR Certificate of
# Registration (Form 2303) and the Acknowledgement Certificate the BIR issues
# for this system. Invoices cannot be issued while the TIN, address or
# Acknowledgement Certificate is still a placeholder; drafts still work.
invoice:
  # "Service Invoice" or "Billing Invoice" (RR 7-2024). Never "Official
  # Receipt" or "Billing Statement": those are only supplementary documents.
  title: "SERVICE INVOICE"
  registered_name: "Law Offices of Villanueva, Dorin & Lozano"
  trade_name: ""
  # TIN with the 5-digit branch code, e.g. 123-456-789-00000.
  tin: "000-000-000-00000"
  address: "[Registered business address on Form 2303]"
  phone: ""
  email: ""

  # Serial numbers. Each invoice takes the next number in this range and
  # numbers are never reused, even for cancelled invoices. The range must be
  # the one registered with the BIR.
  number_prefix: ""
  number_digits: 6
  series_start: 1
  series_end: 999999

  # Printed at the bottom of every invoice (RR 7-2024 Sec. 6(B)(21)).
  acknowledgement_certificate_no: "[ACCN]"
  acknowledgement_certificate_date: ""

  # Whether disbursements billed back to the client are part of VATable
  # sales. Set to false only if your accountant confirms they qualify as
  # reimbursements; they are then shown as VAT-exempt.
  disbursements_vatable: true

  # EWT rates offered when the client withholds. ewt_rate above is the
  # default; 10% applies while the firm's gross income for the year is
  # ₱720,000 or less.
  ewt_rates: [0.10, 0.15]

  payment_terms: "Payable within 15 days of receipt."
  # Optional bank details printed under the totals, one line each.
  payment_instructions: []
