# /etc/nginx/sites-available/vdl-dashboard
# Replace dashboard.vdl-law.ph with the real address. Certbot fills in the certificate lines.
upstream vdl_dashboard {
  server 127.0.0.1:6000;
}

server {
  listen 80;
  listen [::]:80;
  server_name dashboard.vdl-law.ph;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name dashboard.vdl-law.ph;

  ssl_certificate     /etc/letsencrypt/live/dashboard.vdl-law.ph/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dashboard.vdl-law.ph/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 256m;
  root /opt/vdl-dashboard/public;

  location ~ ^/(assets|fonts)/ {
    expires max;
    access_log off;
    try_files $uri @app;
  }

  location / { try_files $uri @app; }

  location @app {
    proxy_pass http://vdl_dashboard;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }
}
