<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'">
  <title>Server settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="../build/icon.png" alt="">
      <div>
        <h1>Law Firm Dashboard</h1>
        <p>Desktop app</p>
      </div>
    </div>
    <h2 id="heading">Connect to your dashboard</h2>
    <p class="lead" id="lead">Enter the address of the firm's dashboard server. Ask your administrator if you are not sure. You can change it later under File, Server settings.</p>
    <form id="form" novalidate>
      <label for="url">Server address</label>
      <input id="url" type="text" autocomplete="url" spellcheck="false" placeholder="https://dashboard.yourfirm.com">
      <div class="hint">On the PC that runs the server, this is usually <code>http://localhost:3000</code>.</div>
      <div class="actions">
        <button type="button" id="test">Test connection</button>
        <span class="spacer"></span>
        <button type="button" id="cancel" hidden>Cancel</button>
        <button type="submit" class="primary" id="save">Save and open</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
    <div class="footer" id="version"></div>
  </main>
  <script src="setup.js"></script>
</body>
</html>
