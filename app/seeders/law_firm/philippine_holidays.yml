# Philippine national holidays seeded as non-working days, so that court deadlines
# that fall on them roll over to the next working day (Rules of Court, Rule 22, Sec. 1).
#
# Sources:
#   2026: Proclamation No. 1006, s. 2025; Eid'l Fitr (Proclamation No. 1189, s. 2026)
#         and Eid'l Adha (Proclamation No. 1264, s. 2026).
#   2027: Proclamation No. 1427, s. 2026. Eid'l Fitr and Eid'l Adha are proclaimed
#         separately once their dates are fixed: add them here or under
#         Administration > Calendars and dates > Working days when announced.
#
# Only days that are clearly non-working nationwide are listed. Special working days
# (EDSA anniversary), local holidays and court closures are left out: a day missing
# here can only make a deadline earlier, never later. Add local holidays and Supreme
# Court-declared closures in Administration as they are announced.
