  santos-title-transfer:
    t_name: Santos condominium title transfer
    identifier: santos-title-transfer
    status_code: on_track
    t_status_explanation: The title is clean. The deed of absolute sale is being drafted.
    t_description: |-
      Transfer of title for a condominium unit in Makati City sold by Spouses Antonio and Teresa Santos to our client, Bea Navarro, for ₱6,200,000. We handle the deed of absolute sale, the BIR taxes and eCAR, the local transfer tax, and the new Condominium Certificate of Title at the Registry of Deeds.
    modules:
      - work_package_tracking
      - news
      - gantt
      - documents
      - meetings
      - costs
      - calendars
    types:
      - :default_type_task
      - :default_type_milestone
      - :default_type_summary_task
      - :legal_type_contract_review
      - :legal_type_filing
      - :legal_type_legal_research
      - :legal_type_document_review
      - :legal_type_client_communication
    t_categories:
      - Deed of sale
      - BIR
      - Registry of Deeds
    queries:
      - t_name: Transfer timeline
        reference: :santos__query__timeline
        timeline: true
        sort_by: id
        hierarchy: true
        starred: true
        module: gantt
        columns:
          - id
          - type
          - subject
          - status
          - start_date
          - due_date
    project-overview:
      row_count: 2
      column_count: 2
      widgets:
        - identifier: "custom_text"
          start_row: 1
          end_row: 2
          start_column: 1
          end_column: 2
          options:
            t_name: "About this matter"
            t_text: |
              **Client (buyer):** Bea Navarro
              **Sellers:** Spouses Antonio and Teresa Santos
              **Property:** Condominium unit, Makati City, CCT No. 012-2019001234
              **Price:** ₱6,200,000

              Taxes: capital gains tax (6%) and documentary stamp tax (1.5%) at the BIR, and transfer tax at the Makati City Treasurer's Office.
        - identifier: "project_status"
          start_row: 1
          end_row: 2
          start_column: 2
          end_column: 3
        - identifier: "work_packages_table"
          start_row: 2
          end_row: 3
          start_column: 1
          end_column: 3
          options:
            t_name: "Transfer timeline"
            queryId: "##query.id:santos__query__timeline"
    work_packages:
      - start: -10
        t_subject: "Conflict check and engagement letter: Spouses Santos"
        t_description: No conflict found. Fixed fee for the transfer, with taxes and registration fees billed at cost.
        status: :default_status_closed
        type: :legal_type_contract_review
        duration: 1
        schedule_manually: true
      - start: -7
        t_subject: Meet buyer and sellers and collect the owner's copy of the title
        description: ""
        status: :default_status_closed
        type: :legal_type_client_communication
        duration: 1
        schedule_manually: true
      - start: 0
        t_subject: Get a certified true copy of the title and check for liens
        reference: :santos__title_check
        labels:
          - :label__billable
        t_description: Request the certified true copy from the Registry of Deeds of Makati City and check the annotations for mortgages, adverse claims or lis pendens.
        status: :default_status_in_progress
        type: :legal_type_document_review
        duration: 3
        estimated_hours: 4
        remaining_hours: 2
        done_ratio: 50
        schedule_manually: true
      - start: 0
        t_subject: Compute capital gains tax, documentary stamp tax and transfer tax
        t_description: The tax base is the highest of the gross selling price, the BIR zonal value and the fair market value in the tax declaration. Capital gains tax is normally the sellers' cost; confirm who pays what in the deed.
        status: :default_status_new
        type: :legal_type_legal_research
        duration: 2
        estimated_hours: 2
        remaining_hours: 2
        done_ratio: 0
        schedule_manually: true
      - start: 3
        t_subject: Prepare the sale documents
        reference: :santos__documents
        description: ""
        status: :default_status_new
        type: :default_type_summary_task
        duration: 7
        schedule_manually: false
        children:
          - start: 3
            t_subject: Draft the deed of absolute sale
            reference: :santos__deed
            description: ""
            status: :legal_status_drafting
            type: :legal_type_contract_review
            duration: 2
            estimated_hours: 4
            remaining_hours: 4
            done_ratio: 0
            schedule_manually: false
            relations:
              - to: :santos__title_check
                type: follows
          - start: 7
            t_subject: Prepare the BIR forms and supporting documents for the eCAR
            description: ""
            status: :default_status_new
            type: :legal_type_filing
            duration: 2
            estimated_hours: 2
            remaining_hours: 2
            done_ratio: 0
            schedule_manually: false
            relations:
              - to: :santos__deed
                type: follows
          - start: 7
            t_subject: Get the real property tax clearance and the condominium certificate of management and dues clearance
            description: ""
            status: :default_status_new
            type: :default_type_task
            duration: 3
            schedule_manually: false
            relations:
              - to: :santos__deed
                type: follows
      - start: 10
        t_subject: Signing and notarization of the deed of absolute sale
        reference: :santos__signing
        description: ""
        status: :default_status_new
        type: :legal_type_client_communication
        duration: 2
        schedule_manually: false
        relations:
          - to: :santos__documents
            type: follows
      - start: 14
        t_subject: Pay capital gains tax and documentary stamp tax at the BIR
        reference: :santos__bir_payment
        t_description: Capital gains tax is due within 30 days of notarization. Documentary stamp tax is due by the 5th day of the following month.
        status: :default_status_new
        type: :default_type_milestone
        duration: 1
        schedule_manually: false
        relations:
          - to: :santos__signing
            type: follows
      - start: 28
        t_subject: BIR releases the eCAR
        reference: :santos__ecar
        t_description: The eCAR usually takes 2 to 4 weeks after payment and complete submission.
        status: :default_status_new
        type: :default_type_milestone
        duration: 1
        schedule_manually: true
      - start: 29
        t_subject: Pay transfer tax and register the sale at the Registry of Deeds
        reference: :santos__registration
        t_description: Pay the transfer tax at the Makati City Treasurer, then file at the Registry of Deeds for the new CCT in the client's name.
        status: :default_status_new
        type: :legal_type_filing
        duration: 4
        schedule_manually: false
        relations:
          - to: :santos__ecar
            type: follows
      - start: 35
        t_subject: Get a new tax declaration from the Makati City Assessor
        description: ""
        status: :default_status_new
        type: :default_type_task
        duration: 3
        schedule_manually: false
        relations:
          - to: :santos__registration
            type: follows
      - start: 70
        t_subject: Transfer tax deadline
        t_description: The local transfer tax is due within 60 days of notarization (Local Government Code, Section 135). Pay it well before this date.
        status: :default_status_new
        type: :default_type_milestone
        duration: 1
        schedule_manually: true

