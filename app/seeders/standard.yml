# Sample Philippine matters. All names, parties, case numbers and facts are fictional.
projects:
  dela-cruz-v-bayanihan:
    t_name: Dela Cruz Trading v. Bayanihan Freight
    identifier: dela-cruz-v-bayanihan
    status_code: on_track
    t_status_explanation: The complaint has been filed and served. Bayanihan Freight's answer is due in about three weeks.
    t_description: |-
      Civil Case No. R-MKT-25-01234-CV, Regional Trial Court of Makati City, Branch 142. Collection of sum of money and damages. Our client, Dela Cruz Trading (Ma. Lourdes Dela Cruz, proprietor), is suing Bayanihan Freight Services, Inc. for ₱4,850,000 in unpaid delivery credits under a 2-year trucking agreement, plus legal interest and attorney's fees.
    # Some people join the matter directly, others through their whole department (group).
    members:
      - principal: :user__marko_marketing
        role: :default_role_member
      - principal: :user__wanda_web
        role: :default_role_member
      - principal: :user__tessa_tester
        role: :default_role_member
      - principal: :department__events_operations
        role: :default_role_member
      - principal: :department__finance_administration
        role: :default_role_member
    project_phases:
      - definition: :default_project_phase_initiating
        duration: 10
      - definition: :default_project_phase_planning
        duration: 20
      - definition: :default_project_phase_executing
        duration: 40
      - definition: :default_project_phase_closing
        duration: 10
    modules:
      - work_package_tracking
      - news
      - gantt
      - board_view
      - team_planner_view
      - meetings
      - documents
      - costs
      - budgets
      - calendars
    news:
      - t_title: Complaint filed and summons served
        t_summary: |
          The complaint was filed with the RTC Makati and the sheriff served summons on Bayanihan Freight.
          Their answer is due 30 calendar days from service.
        t_description: Document review and the discovery requests start this week. See the Discovery work packages for who is doing what.
    types:
      - :default_type_task
      - :default_type_milestone
      - :default_type_summary_task
      - :legal_type_court_deadline
      - :legal_type_hearing
      - :legal_type_filing
      - :legal_type_legal_research
      - :legal_type_document_review
      - :legal_type_client_communication
    t_categories:
      - Pleadings
      - Discovery
      - Pre-trial
      - Mediation and JDR
    queries:
      - t_name: Case plan
        reference: :delacruz__query__case_plan
        status: open
        timeline: true
        sort_by: id
        hierarchy: true
        starred: true
        module: gantt
        columns:
          - id
          - type
          - subject
          - status
          - start_date
          - due_date
          - assigned_to
      - t_name: Deadlines and hearings
        reference: :delacruz__query__deadlines
        type:
          - :legal_type_court_deadline
          - :legal_type_hearing
          - :default_type_milestone
        timeline: true
        sort_by: id
        columns:
          - id
          - type
          - subject
          - status
          - due_date
      - t_name: Open tasks
        reference: :delacruz__query__open_tasks
        status: open
        hierarchy: true
        sort_by: id
        columns:
          - id
          - type
          - subject
          - status
          - assigned_to
          - due_date
      - t_name: Team planner
        module: team_planner
        assigned_to: :openproject_admin
    boards:
      kanban:
        t_name: "Filings board"
        filters:
          - type: :legal_type_filing
        statuses:
          - :default_status_new
          - :legal_status_drafting
          - :legal_status_partner_review
          - :legal_status_filed
          - :default_status_closed
      basic:
        t_name: "Priorities"
        lists:
          - t_name: "This week"
            work_packages:
              - :delacruz__review_records
              - :delacruz__interest_research
          - t_name: "Next week"
            work_packages:
              - :delacruz__interrogatories
          - t_name: "Waiting on the client"
            work_packages:
              - :delacruz__judicial_affidavit
      parent_child:
        t_name: "Case breakdown"
        parents:
          - :delacruz__pleadings
          - :delacruz__discovery
    project-overview:
      row_count: 4
      column_count: 2
      widgets:
        - identifier: "custom_text"
          start_row: 1
          end_row: 3
          start_column: 1
          end_column: 2
          options:
            t_name: "About this matter"
            t_text: |
              **Case:** Civil Case No. R-MKT-25-01234-CV
              **Court:** Regional Trial Court, Makati City, Branch 142
              **Client (plaintiff):** Dela Cruz Trading, Ma. Lourdes Dela Cruz, proprietor
              **Defendant:** Bayanihan Freight Services, Inc. (counsel: Villaruel Tan & Associates)
              **Amount claimed:** ₱4,850,000 plus legal interest and attorney's fees

              Useful views:

              * [Case plan]({{opSetting:base_url}}/projects/dela-cruz-v-bayanihan/work_packages?query_id=##query.id:delacruz__query__case_plan) shows every task on a timeline.
              * [Deadlines and hearings]({{opSetting:base_url}}/projects/dela-cruz-v-bayanihan/work_packages?query_id=##query.id:delacruz__query__deadlines) lists the court dates.
              * [Open tasks]({{opSetting:base_url}}/projects/dela-cruz-v-bayanihan/work_packages?query_id=##query.id:delacruz__query__open_tasks) lists the work still to do.
        - identifier: "project_status"
          start_row: 1
          end_row: 2
          start_column: 2
          end_column: 3
        - identifier: "members"
          start_row: 2
          end_row: 3
          start_column: 2
          end_column: 3
          options:
            name: "Members"
        - identifier: "work_packages_overview"
          start_row: 3
          end_row: 4
          start_column: 1
          end_column: 3
          options:
            t_name: "Work packages"
        - identifier: "work_packages_table"
          start_row: 4
          end_row: 5
          start_column: 1
          end_column: 3
          options:
            t_name: "Deadlines and hearings"
            queryId: "##query.id:delacruz__query__deadlines"
    # For all dates, the reference is the Monday of the current week
    # So
    # * start: 0 references Monday
    # * start: 4 references Friday
    # * start: -7 references the Monday of last week
    work_packages:
      - start: -14
        t_subject: Matter opened and engagement letter signed
        description:
        status: :default_status_closed
        type: :default_type_milestone
        duration: 1
        schedule_manually: true
      - start: -14
        t_subject: Pleadings
        reference: :delacruz__pleadings
        assigned_to: :user__adam_admin
        description: ""
        status: :default_status_in_progress
        type: :default_type_summary_task
        duration: 38
        schedule_manually: false
        children:
          - start: -14
            t_subject: Draft and file the complaint and pay docket fees
            reference: :delacruz__complaint
            assigned_to: :user__evan_events
            t_description: |-
              Causes of action: collection of sum of money, breach of contract and damages.
              Attach the trucking agreement, the unpaid credit memos and the final demand letter as annexes, with the verification and certification against forum shopping.
            status: :default_status_closed
            type: :legal_type_filing
            duration: 5
            estimated_hours: 14
            remaining_hours: 0
            done_ratio: 100
            schedule_manually: true
          - start: -7
            t_subject: Summons served on Bayanihan Freight by the sheriff
            description: ""
            status: :default_status_closed
            type: :legal_type_court_deadline
            duration: 1
            schedule_manually: false
            relations:
              - to: :delacruz__complaint
                type: follows
          - start: 23
            t_subject: Answer of Bayanihan Freight due
            t_description: The answer is due 30 calendar days from service of summons (Rule 11, 2019 Amended Rules of Civil Procedure). If nothing is filed, move to declare the defendant in default.
            status: :default_status_scheduled
            type: :legal_type_court_deadline
            duration: 1
            schedule_manually: true
      - start: 0
        t_subject: Discovery
        reference: :delacruz__discovery
        assigned_to: :department__events_operations
        description: ""
        status: :default_status_in_progress
        type: :default_type_summary_task
        duration: 12
        schedule_manually: false
        children:
          - start: 0
            t_subject: Review the client's delivery receipts, invoices and credit memos
            reference: :delacruz__review_records
            assigned_to: :user__wanda_web
            labels:
              - :label__billable
              - :label__privileged
            t_description: |-
              Build a table of every missed or late delivery with the matching sales invoice and credit memo.
              *   [x] 2024 delivery receipts
              *   [ ] 2025 delivery receipts
              *   [ ] Credit memos and statements of account
            status: :default_status_in_progress
            type: :legal_type_document_review
            duration: 5
            estimated_hours: 20
            remaining_hours: 12
            done_ratio: 40
            schedule_manually: true
          - start: 0
            t_subject: Research legal interest and attorney's fees under the Civil Code
            reference: :delacruz__interest_research
            assigned_to: :user__olga_ops
            labels:
              - :label__billable
            t_description: Check the 6% per annum legal interest rule on unpaid sums and when it starts to run (from extrajudicial demand or from filing).
            status: :default_status_in_progress
            type: :legal_type_legal_research
            duration: 4
            estimated_hours: 12
            remaining_hours: 8
            done_ratio: 30
            schedule_manually: true
          - start: 1
            t_subject: Get Ms. Dela Cruz's signed judicial affidavit
            reference: :delacruz__judicial_affidavit
            assigned_to: :user__marko_marketing
            labels:
              - :label__waiting_on_client
            t_description: Draft sent to the client. Waiting for her signature before a notary and the two missing delivery receipts.
            status: :legal_status_awaiting_client
            type: :legal_type_client_communication
            duration: 3
            schedule_manually: true
          - start: 7
            t_subject: Draft written interrogatories to Bayanihan Freight
            reference: :delacruz__interrogatories
            description: ""
            status: :legal_status_drafting
            type: :legal_type_filing
            duration: 4
            estimated_hours: 10
            remaining_hours: 10
            done_ratio: 0
            schedule_manually: false
            relations:
              - to: :delacruz__review_records
                type: follows
          - start: 7
            t_subject: Draft the request for admission
            assigned_to: :user__tessa_tester
            description: ""
            status: :default_status_new
            type: :legal_type_filing
            duration: 4
            estimated_hours: 8
            remaining_hours: 8
            done_ratio: 0
            schedule_manually: false
            relations:
              - to: :delacruz__review_records
                type: follows
          - start: 11
            t_subject: Serve the interrogatories and request for admission
            labels:
              - :label__urgent
            description: ""
            status: :default_status_scheduled
            type: :legal_type_court_deadline
            duration: 1
            schedule_manually: true
      - start: 4
        t_subject: Send the monthly case update to the client
        description: ""
        status: :default_status_new
        type: :legal_type_client_communication
        duration: 1
        schedule_manually: true
      - start: 25
        t_subject: Pre-trial brief and judicial affidavits due
        t_description: File and serve the pre-trial brief and the judicial affidavits of our witnesses at least 3 days before the pre-trial.
        status: :default_status_scheduled
        type: :legal_type_court_deadline
        duration: 1
        schedule_manually: true
      - start: 32
        t_subject: Pre-trial conference
        t_description: RTC Makati, Branch 142, 8:30 AM. The client must attend or send a representative with a special power of attorney.
        status: :default_status_scheduled
        type: :legal_type_hearing
        duration: 1
        schedule_manually: true
      - start: 39
        t_subject: Court-annexed mediation at the Philippine Mediation Center
        description: ""
        status: :default_status_new
        type: :default_type_milestone
        duration: 1
        schedule_manually: true
      - start: 46
        t_subject: Judicial Dispute Resolution (JDR) conference
        t_description: Only needed if mediation at the Philippine Mediation Center fails.
        status: :default_status_new
        type: :legal_type_hearing
        duration: 1
        schedule_manually: true
    t_wiki: |
      ### Case notes

      _Use this wiki for notes that do not belong to a single task._

      **Key facts**

      * The trucking agreement started on 1 March 2024 and runs for two years.
      * Bayanihan Freight missed or delayed 41 deliveries between May 2024 and June 2025.
      * Bayanihan Freight issued credit memos for 17 of them, worth ₱4,850,000, and never paid them.
      * Final demand letter sent on 15 August 2025 and received the next day.

      **Strategy**

      * Lead with the credit memos. They are Bayanihan Freight's own documents.
      * Claim legal interest from the date of the final demand.

      **Contacts**

      * Client: Ma. Lourdes Dela Cruz, proprietor of Dela Cruz Trading
      * Opposing counsel: Atty. Ramon Villaruel, Villaruel Tan & Associates
