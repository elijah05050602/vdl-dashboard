# Sample matters. All names, parties and facts are fictional.
projects:
  harlow-v-brightline:
    t_name: Harlow v. Brightline Logistics
    identifier: harlow-v-brightline
    status_code: on_track
    t_status_explanation: Pleadings are complete and discovery has started. The next court date is the case management conference.
    t_description: |-
      Breach of contract suit. Our client, Dana Harlow (Harlow Home Goods), is suing Brightline Logistics for missed deliveries and unpaid credits under a 2-year freight agreement. Claimed damages are about $184,000 plus interest.
    # Some people join the matter directly, others through their whole department (group).
    members:
      - principal: :user__marko_marketing
        role: :default_role_member
      - principal: :user__wanda_web
        role: :default_role_member
      - principal: :user__tessa_tester
        role: :default_role_member
      - principal: :department__events_operations
        role: :default_role_member
      - principal: :department__finance_administration
        role: :default_role_member
    project_phases:
      - definition: :default_project_phase_initiating
        duration: 10
      - definition: :default_project_phase_planning
        duration: 20
      - definition: :default_project_phase_executing
        duration: 40
      - definition: :default_project_phase_closing
        duration: 10
    modules:
      - work_package_tracking
      - news
      - gantt
      - board_view
      - team_planner_view
      - meetings
      - documents
      - costs
      - budgets
      - calendars
    news:
      - t_title: Complaint filed and served
        t_summary: |
          The complaint was filed and Brightline Logistics has been served.
          Their answer is due in two weeks.
        t_description: Discovery starts this week. See the Discovery work packages for who is doing what.
    types:
      - :default_type_task
      - :default_type_milestone
      - :default_type_summary_task
      - :legal_type_court_deadline
      - :legal_type_hearing
      - :legal_type_filing
      - :legal_type_legal_research
      - :legal_type_document_review
      - :legal_type_client_communication
    t_categories:
      - Pleadings
      - Discovery
      - Motions
      - Settlement
    queries:
      - t_name: Case plan
        reference: :harlow__query__case_plan
        status: open
        timeline: true
        sort_by: id
        hierarchy: true
        starred: true
        module: gantt
        columns:
          - id
          - type
          - subject
          - status
          - start_date
          - due_date
          - assigned_to
      - t_name: Deadlines and hearings
        reference: :harlow__query__deadlines
        type:
          - :legal_type_court_deadline
          - :legal_type_hearing
          - :default_type_milestone
        timeline: true
        sort_by: id
        columns:
          - id
          - type
          - subject
          - status
          - due_date
      - t_name: Open tasks
        reference: :harlow__query__open_tasks
        status: open
        hierarchy: true
        sort_by: id
        columns:
          - id
          - type
          - subject
          - status
          - assigned_to
          - due_date
      - t_name: Team planner
        module: team_planner
        assigned_to: :openproject_admin
    boards:
      kanban:
        t_name: "Filings board"
        filters:
          - type: :legal_type_filing
        statuses:
          - :default_status_new
          - :legal_status_drafting
          - :legal_status_partner_review
          - :legal_status_filed
          - :default_status_closed
      basic:
        t_name: "Priorities"
        lists:
          - t_name: "This week"
            work_packages:
              - :harlow__review_logs
              - :harlow__damages_research
          - t_name: "Next week"
            work_packages:
              - :harlow__interrogatories
          - t_name: "Waiting on the client"
            work_packages:
              - :harlow__declaration
      parent_child:
        t_name: "Case breakdown"
        parents:
          - :harlow__pleadings
          - :harlow__discovery
    project-overview:
      row_count: 4
      column_count: 2
      widgets:
        - identifier: "custom_text"
          start_row: 1
          end_row: 3
          start_column: 1
          end_column: 2
          options:
            t_name: "About this matter"
            t_text: |
              **Client:** Dana Harlow, Harlow Home Goods
              **Opposing party:** Brightline Logistics (counsel: Reyes & Okafor)
              **Court:** Superior Court, Civil Division
              **Matter type:** Commercial litigation, plaintiff

              Useful views:

              * [Case plan]({{opSetting:base_url}}/projects/harlow-v-brightline/work_packages?query_id=##query.id:harlow__query__case_plan) shows every task on a timeline.
              * [Deadlines and hearings]({{opSetting:base_url}}/projects/harlow-v-brightline/work_packages?query_id=##query.id:harlow__query__deadlines) lists the court dates.
              * [Open tasks]({{opSetting:base_url}}/projects/harlow-v-brightline/work_packages?query_id=##query.id:harlow__query__open_tasks) lists the work still to do.
        - identifier: "project_status"
          start_row: 1
          end_row: 2
          start_column: 2
          end_column: 3
        - identifier: "members"
          start_row: 2
          end_row: 3
          start_column: 2
          end_column: 3
          options:
            name: "Members"
        - identifier: "work_packages_overview"
          start_row: 3
          end_row: 4
          start_column: 1
          end_column: 3
          options:
            t_name: "Work packages"
        - identifier: "work_packages_table"
          start_row: 4
          end_row: 5
          start_column: 1
          end_column: 3
          options:
            t_name: "Deadlines and hearings"
            queryId: "##query.id:harlow__query__deadlines"
    # For all dates, the reference is the Monday of the current week
    # So
    # * start: 0 references Monday
    # * start: 4 references Friday
    # * start: -7 references the Monday of last week
    work_packages:
      - start: -14
        t_subject: Matter opened
        description:
        status: :default_status_closed
        type: :default_type_milestone
        duration: 1
        schedule_manually: true
      - start: -14
        t_subject: Pleadings
        reference: :harlow__pleadings
        assigned_to: :user__adam_admin
        description: ""
        status: :default_status_in_progress
        type: :default_type_summary_task
        duration: 29
        schedule_manually: false
        children:
          - start: -14
            t_subject: Draft and file the complaint
            reference: :harlow__complaint
            assigned_to: :user__evan_events
            t_description: |-
              Counts: breach of contract, breach of the implied covenant of good faith, and account stated.
              Attach the freight agreement and the unpaid credit memos as exhibits.
            status: :default_status_closed
            type: :legal_type_filing
            duration: 5
            estimated_hours: 14
            remaining_hours: 0
            done_ratio: 100
            schedule_manually: true
          - start: -7
            t_subject: Serve the summons and complaint
            description: ""
            status: :default_status_closed
            type: :legal_type_court_deadline
            duration: 1
            schedule_manually: false
            relations:
              - to: :harlow__complaint
                type: follows
          - start: 14
            t_subject: Brightline's answer due
            t_description: Answer is due 21 days after service. If nothing is filed, prepare a request for entry of default.
            status: :default_status_scheduled
            type: :legal_type_court_deadline
            duration: 1
            schedule_manually: true
      - start: 0
        t_subject: Discovery
        reference: :harlow__discovery
        assigned_to: :department__events_operations
        description: ""
        status: :default_status_in_progress
        type: :default_type_summary_task
        duration: 12
        schedule_manually: false
        children:
          - start: 0
            t_subject: Review the client's shipping logs and invoices
            reference: :harlow__review_logs
            assigned_to: :user__wanda_web
            labels:
              - :label__billable
              - :label__privileged
            t_description: |-
              Build a table of every missed or late delivery with the matching invoice and credit memo.
              *   [x] 2024 shipping logs
              *   [ ] 2025 shipping logs
              *   [ ] Credit memos
            status: :default_status_in_progress
            type: :legal_type_document_review
            duration: 5
            estimated_hours: 20
            remaining_hours: 12
            done_ratio: 40
            schedule_manually: true
          - start: 0
            t_subject: Research damages and interest for late payment
            reference: :harlow__damages_research
            assigned_to: :user__olga_ops
            labels:
              - :label__billable
            description: ""
            status: :default_status_in_progress
            type: :legal_type_legal_research
            duration: 4
            estimated_hours: 12
            remaining_hours: 8
            done_ratio: 30
            schedule_manually: true
          - start: 1
            t_subject: Get a signed declaration from Ms. Harlow
            reference: :harlow__declaration
            assigned_to: :user__marko_marketing
            labels:
              - :label__waiting_on_client
            t_description: Draft sent to the client. Waiting for her signature and the two missing delivery receipts.
            status: :legal_status_awaiting_client
            type: :legal_type_client_communication
            duration: 3
            schedule_manually: true
          - start: 7
            t_subject: Draft the first set of interrogatories
            reference: :harlow__interrogatories
            description: ""
            status: :legal_status_drafting
            type: :legal_type_filing
            duration: 4
            estimated_hours: 10
            remaining_hours: 10
            done_ratio: 0
            schedule_manually: false
            relations:
              - to: :harlow__review_logs
                type: follows
          - start: 7
            t_subject: Draft requests for production of documents
            assigned_to: :user__tessa_tester
            description: ""
            status: :default_status_new
            type: :legal_type_filing
            duration: 4
            estimated_hours: 8
            remaining_hours: 8
            done_ratio: 0
            schedule_manually: false
            relations:
              - to: :harlow__review_logs
                type: follows
          - start: 11
            t_subject: Initial disclosures due
            labels:
              - :label__urgent
            description: ""
            status: :default_status_scheduled
            type: :legal_type_court_deadline
            duration: 1
            schedule_manually: true
      - start: 4
        t_subject: Send the monthly case update to the client
        description: ""
        status: :default_status_new
        type: :legal_type_client_communication
        duration: 1
        schedule_manually: true
      - start: 18
        t_subject: Case management conference
        t_description: Department 12, 9:00 AM. Bring the proposed discovery plan and trial-date availability.
        status: :default_status_scheduled
        type: :legal_type_hearing
        duration: 1
        schedule_manually: true
      - start: 32
        t_subject: Hearing on motion to compel discovery
        t_description: Only needed if Brightline does not answer the interrogatories on time.
        status: :default_status_new
        type: :legal_type_hearing
        duration: 1
        schedule_manually: true
      - start: 39
        t_subject: Court-ordered mediation
        description: ""
        status: :default_status_new
        type: :default_type_milestone
        duration: 1
        schedule_manually: true
    t_wiki: |
      ### Case notes

      _Use this wiki for notes that do not belong to a single task._

      **Key facts**

      * The freight agreement started on 1 March 2024 and runs for two years.
      * Brightline missed or delayed 41 deliveries between May 2024 and June 2025.
      * Brightline issued credit memos for 17 of them and never paid them.

      **Strategy**

      * Lead with the account stated claim. The credit memos are Brightline's own documents.
      * Ask for prejudgment interest from the date of each credit memo.

      **Contacts**

      * Client: Dana Harlow, owner of Harlow Home Goods
      * Opposing counsel: Priya Okafor, Reyes & Okafor
