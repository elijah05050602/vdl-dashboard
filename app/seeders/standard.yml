        description: ""
        status: :default_status_in_progress
        type: :default_type_summary_task
        duration: 9
        schedule_manually: false
        children:
          - start: 0
            t_subject: Compile payslips, the termination letter and company memos
            reference: :reyes__evidence
            labels:
              - :label__billable
            t_description: |-
              *   [x] Payslips for the last 12 months
              *   [x] Termination letter
              *   [ ] Company memos on the incident
              *   [ ] SSS employment history
            status: :default_status_in_progress
