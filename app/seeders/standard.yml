welcome:
  t_title: "Welcome to the Law Firm Dashboard"
  t_text: |
    This workspace tracks the firm's matters from intake to close. Each project is a matter, and each work package is a piece of work on it.

    Getting started:

    * Open a matter and add its **Court deadlines** and **Hearings** so they appear on the calendar and Gantt chart.
    * Track drafting with **Filing** and **Contract review** work packages, moving them through Drafting, Partner review and Filed.
    * Log time against each matter with the legal activities (Legal research, Drafting, Court appearance and more) to feed billing reports.
    * Use **Client communication** work packages to record what is waiting on the client.

    For Admins: You can change this welcome text [here]({{opSetting:base_url}}/admin/settings/general).
